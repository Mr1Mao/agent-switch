[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-switch"
version = "0.1.0"
description = "Unified abstraction layer for agent SDKs (deepagents, Qcoder SDK, etc.)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agent-switch contributors" }]
keywords = ["agent", "sdk", "deepagents", "llm", "abstraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
deepagents = [
    "deepagents",
    "langchain-deepseek>=0.1.0",
]
qcoder = [
    "qoder-agent-sdk",
]
all = [
    "deepagents",
    "qoder-agent-sdk",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "ruff>=0.6",
    "deepagents",
    "langchain-deepseek>=0.1.0",
    "qoder-agent-sdk",
    "python-dotenv>=1.0",
]

[tool.hatch.build]
sources = ["src"]

# 显式声明要打进 wheel 的包：项目名 agent-switch 与导入名 agent_core 不同，
# hatchling 的自动发现按「目录名匹配项目名」无法找到 src/agent_core/，必须显式指定。
[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["agent_core"]
mypy_path = "src"
